[package]
name = "velorec_rust2024"
version = "0.1.0"
edition = "2024"
authors = ["VeloRec Team"]
description = "Motor de grabación de pantalla de alto rendimiento en Rust (Edition 2024)"

[lib]
name = "velorec_rust2024"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Enlace con la JVM de Android
jni = { version = "0.21.1", default-features = false }

# APIs nativas de Android NDK (MediaCodec, ANativeWindow, etc.)
ndk = { version = "0.9.0", default-features = false, features = ["media", "bitmap"] }
ndk-sys = "0.6.0"
libc = "0.2.169"

# Canales sin bloqueo y sin asignación de memoria dinámica continua
crossbeam-channel = "0.5.14"

# Sistema de logs para logcat de Android
log = "0.4.22"
android_logger = "0.14.1"

# =========================================================================
# LIBRERÍAS INTEGRADAS DE ALTO RENDIMIENTO (RUST EDICIÓN 2024)
# =========================================================================

# 1. Google Oboe para captura de audio de ultra baja latencia (<10 ms, AAudio/OpenSL ES)
# 'shared-stdcxx' enlaza dinámicamente con libc++_shared.so resolviendo __gxx_personality_v0 y unificando el STL de C++
oboe = { version = "0.6.1", default-features = false, features = ["shared-stdcxx"] }

# 2. Conversión de color YUV a RGB con aceleración SIMD ARM NEON en Rust puro
yuvutils-rs = { version = "0.7.0", default-features = false, features = ["fast_mode"] }

# 3. GL on Whatever (Glow) para sombreadores GPU OpenGL ES 3.20 multiplataforma
glow = { version = "0.16.0", default-features = false }

[profile.dev]
opt-level = 1
panic = "abort"

[profile.release]
opt-level = 3
panic = "abort"
strip = true

