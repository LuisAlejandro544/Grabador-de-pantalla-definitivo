# gradle.properties - Configuración de compilación para Android
# Habilitar soporte AndroidX (Requerido por React Native, AppCompat y Coroutines)
android.useAndroidX=true

# Optimización de JVM para runners en GitHub Actions y compilación móvil
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
